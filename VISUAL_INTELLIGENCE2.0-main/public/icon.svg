<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a1f33"/>
      <stop offset="1" stop-color="#3d0810"/>
    </linearGradient>
    <radialGradient id="core" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#f3c3ca"/>
      <stop offset="0.3" stop-color="#b8374f"/>
      <stop offset="0.75" stop-color="#5a0d18"/>
      <stop offset="1" stop-color="#2a050a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <!-- orbit, echoing the hero's intelligence core -->
  <ellipse cx="32" cy="32" rx="27" ry="9" fill="none" stroke="#e9adb5" stroke-opacity=".45" stroke-width="1.6" transform="rotate(-28 32 32)"/>
  <!-- eye -->
  <path d="M7 32 C17 16.5 47 16.5 57 32 C47 47.5 17 47.5 7 32 Z" fill="none" stroke="#f1eee7" stroke-width="3.6" stroke-linejoin="round"/>
  <!-- iris: the intelligence core -->
  <circle cx="32" cy="32" r="10.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#f1eee7" stroke-width="1.4" stroke-opacity=".9"/>
  <ellipse cx="28.2" cy="27.8" rx="3" ry="2.2" fill="#ffffff" fill-opacity=".92" transform="rotate(-35 28.2 27.8)"/>
  <!-- orbiting node -->
  <circle cx="54.6" cy="20" r="2.6" fill="#f1eee7"/>
</svg>
